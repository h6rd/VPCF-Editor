name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywinstyles send2trash vpk customtkinter

      - name: Build
        run: >
          pyinstaller
          --noconsole
          --onefile
          --add-data "icon.ico;."
          --collect-all vpk
          --collect-all pywinstyles
          --collect-all send2trash
          --collect-all customtkinter
          --icon=icon.ico
          --name "VPCF-Editor"
          main.py

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "VPCF-Editor" -Force
          Copy-Item "dist\VPCF-Editor.exe" "VPCF-Editor\VPCF-Editor.exe"
          Compress-Archive -Path "VPCF-Editor" -DestinationPath "VPCF-Editor-Win.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: VPCF-Editor-Win.zip

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VPCF-Editor-Win.zip
          generate_release_notes: true